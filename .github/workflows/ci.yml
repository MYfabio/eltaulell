name: Validació

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-only-secret-not-used-in-production
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eltaulell_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
